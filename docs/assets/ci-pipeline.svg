<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
  <title id="t">A Certain Woman: CI and security pipeline</title>
  <desc id="d">Pull requests, pushes to main and scheduled runs trigger five checks across two workflows. All five checks must pass before a change merges to main, which Vercel then deploys.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b6914a"/>
    </marker>
    <style>
      .serif { font-family: "DM Serif Display", Georgia, "Times New Roman", serif; }
      .sans { font-family: Manrope, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; letter-spacing: 2px; fill: #6f6857; font-weight: 600; }
      .label { font-size: 13px; fill: #1f2620; font-weight: 600; }
      .meta { font-size: 11px; fill: #6f6857; }
      .wire { stroke: #b6914a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" rx="18" fill="#faf6ee" stroke="#e6dac2"/>

  <!-- Column headings -->
  <text x="40" y="44" class="sans eyebrow">TRIGGERS</text>
  <text x="270" y="44" class="sans eyebrow">CHECKS</text>
  <text x="640" y="44" class="sans eyebrow">GATE AND DEPLOY</text>

  <!-- Triggers -->
  <g class="sans">
    <rect x="40" y="70" width="170" height="52" rx="10" fill="#f2eadb"/>
    <text x="56" y="92" class="label">Pull request</text>
    <text x="56" y="110" class="meta">every branch, every push</text>

    <rect x="40" y="136" width="170" height="52" rx="10" fill="#f2eadb"/>
    <text x="56" y="158" class="label">Push to main</text>
    <text x="56" y="176" class="meta">after a merge</text>

    <rect x="40" y="202" width="170" height="52" rx="10" fill="#f2eadb"/>
    <text x="56" y="224" class="label">Daily 06:00 UTC</text>
    <text x="56" y="242" class="meta">dependency audit only</text>

    <rect x="40" y="268" width="170" height="52" rx="10" fill="#f2eadb"/>
    <text x="56" y="290" class="label">Mondays 05:00 UTC</text>
    <text x="56" y="308" class="meta">secret scan and CodeQL</text>
  </g>

  <!-- Wires from triggers to the check panel -->
  <path class="wire" d="M210 96 H246" marker-end="url(#arrow)"/>
  <path class="wire" d="M210 162 H246" marker-end="url(#arrow)"/>
  <path class="wire" d="M210 228 H246" marker-end="url(#arrow)"/>
  <path class="wire" d="M210 294 H246" marker-end="url(#arrow)"/>

  <!-- CI workflow -->
  <g class="sans">
    <rect x="254" y="62" width="330" height="176" rx="12" fill="#ffffff" stroke="#e6dac2"/>
    <text x="270" y="84" class="serif" font-size="16" fill="#1f3d2b">ci.yml</text>

    <circle cx="280" cy="110" r="5" fill="#1f3d2b"/>
    <text x="294" y="114" class="label">Lint, typecheck and build</text>
    <text x="294" y="130" class="meta">pnpm install --frozen-lockfile, no secrets</text>

    <circle cx="280" cy="156" r="5" fill="#1f3d2b"/>
    <text x="294" y="160" class="label">Dependency audit</text>
    <text x="294" y="176" class="meta">pnpm audit --audit-level high</text>

    <circle cx="280" cy="202" r="5" fill="#1f3d2b"/>
    <text x="294" y="206" class="label">Dependency review</text>
    <text x="294" y="222" class="meta">pull requests only, fails on moderate+</text>
  </g>

  <!-- Security workflow -->
  <g class="sans" transform="translate(0 10)">
    <rect x="254" y="242" width="330" height="120" rx="12" fill="#ffffff" stroke="#e6dac2"/>
    <text x="270" y="264" class="serif" font-size="16" fill="#1f3d2b">security.yml</text>

    <circle cx="280" cy="290" r="5" fill="#b6914a"/>
    <text x="294" y="294" class="label">Secret scan</text>
    <text x="294" y="310" class="meta">gitleaks, full git history</text>

    <circle cx="280" cy="336" r="5" fill="#b6914a"/>
    <text x="294" y="340" class="label">CodeQL</text>
    <text x="294" y="356" class="meta">security-extended queries</text>
  </g>

  <!-- Gate -->
  <path class="wire" d="M584 145 C612 145 612 190 632 190" marker-end="url(#arrow)"/>
  <path class="wire" d="M584 312 C612 312 612 220 632 220" marker-end="url(#arrow)"/>

  <g class="sans">
    <rect x="640" y="160" width="200" height="90" rx="12" fill="#1f3d2b"/>
    <text x="658" y="188" class="serif" font-size="17" fill="#faf6ee">Branch protection</text>
    <text x="658" y="210" font-size="11" fill="#d4ae6b">all five checks required</text>
    <text x="658" y="228" font-size="11" fill="#d4ae6b">no direct push, no force push</text>

    <path class="wire" d="M740 250 V282" marker-end="url(#arrow)"/>

    <rect x="640" y="290" width="200" height="60" rx="12" fill="#f2eadb"/>
    <text x="658" y="316" class="label">Merge to main</text>
    <text x="658" y="334" class="meta">Vercel builds and deploys</text>
  </g>

  <!-- Supply chain note -->
  <text x="640" y="84" class="sans label">Actions pinned by SHA</text>
  <text x="640" y="102" class="sans meta">Dependabot bumps them weekly</text>
  <text x="640" y="126" class="sans label">Packages wait 14 days</text>
  <text x="640" y="144" class="sans meta">minimumReleaseAge in pnpm</text>
</svg>
